<!doctype html>
<html lang="en">
    <head>
        <title>Title</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/@vetixy/circular-std@1.0.0/dist/index.min.css"
        />
        <link rel="stylesheet" href="src/styles/reset.css" />
        <link rel="stylesheet" href="src/styles/main.scss" />
    </head>
    <body>
        <div class="container">
            <header class="header">
                <div class="header__logo">
                    <a href="/">
                        <img src="/assets/icons/logo.svg" alt="logo"
                    /></a>
                </div>
                <div class="header__links header__links--none"></div>
                <div class="header__burger">
                    <button>
                        <img src="/assets/icons/burger.svg" alt="burger" />
                    </button>
                </div>
                <div class="header__buttons">
                    <button class="button header__button--signup" type="button">
                        Log In
                    </button>
                    <button class="button header__button--login" type="button">
                        Sign Up
                    </button>
                </div>
            </header>
        </div>

        <script type="module" src="./src/script/startup.js"></script>
        <script type="module" src="./src/script/index.js"></script>
    </body>
</html>

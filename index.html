<!doctype html>
<html lang="en">
    <head>
        <title>Explore the World - Travel Portal</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css"
        />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/@vetixy/circular-std@1.0.0/dist/index.min.css"
        />
        <link rel="stylesheet" href="src/styles/main.scss" />
    </head>
    <body>
        <div class="container">
            <header class="header">
                <div class="header__logo">
                    <a href="/">
                        <img src="/assets/icons/logo.svg" alt="logo"
                    /></a>
                </div>
                <nav class="header__links header__links--none"></nav>
                <div class="header__burger">
                    <button type="button">
                        <img src="/assets/icons/burger.svg" alt="hamburger" />
                    </button>
                </div>
                <div class="header__buttons">
                    <button
                        class="button header__button--login text-button"
                        type="button"
                    >
                        Log In
                    </button>
                    <button
                        class="button header__button--signup text-button"
                        type="button"
                    >
                        Sign Up
                    </button>
                </div>
            </header>

            <main class="hero">
                <img
                    class="hero__triangle"
                    src="public/assets/icons/triangles.svg"
                    alt="triangles"
                />
                <div class="hero__left-section">
                    <div class="hero__left-section__top">
                        Explore the world!
                        <img src="assets/icons/work.svg" alt="work" />
                    </div>
                    <h1 class="text-hero-heading heading">
                        Travel <span>top destination</span> of the world
                    </h1>
                    <p class="description text-body">
                        We always make our customer happy by providing <br />
                        as many choices as possible
                    </p>
                    <div class="hero__left-section__buttons">
                        <button
                            type="button"
                            class="button button--get-started text-button"
                        >
                            Get Started
                        </button>
                        <button
                            type="button"
                            class="button button--watch-demo text-button"
                        >
                            <img src="assets/icons/play-circle.svg" alt="" />
                            <span>Watch Demo</span>
                        </button>
                    </div>
                </div>
                <div class="hero__right-section">
                    <div class="hero__right-section__box">
                        <div class="hero__right-section__images-left">
                            <img
                                class="hero__right-section__img image-1"
                                src="assets/images/Rectangle 1.png"
                                alt="Traveler exploring"
                            />
                            <img
                                class="msg-icon"
                                src="assets/icons/message.svg"
                                alt="plane"
                            />
                            <img
                                class="friend-icon"
                                src="assets/icons/friends.svg"
                                alt="friend"
                            />
                            <img
                                class="location-icon"
                                src="assets/icons/location.svg"
                                alt="location"
                            />
                            <img
                                class="hero__right-section__img image-2"
                                src="assets/images/Rectangle 2.png"
                                alt="Scenic view"
                            />
                        </div>
                        <img
                            class="hero__right-section__img image-3"
                            src="assets/images/Rectangle 3.png"
                            alt="Destination card"
                        />
                    </div>
                </div>
            </main>
        </div>

        <script type="module" src="./src/script/startup.js"></script>
        <script type="module" src="./src/script/index.js"></script>
    </body>
</html>

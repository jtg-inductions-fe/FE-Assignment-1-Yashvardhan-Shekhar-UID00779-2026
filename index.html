<!doctype html>
<html lang="en">
    <head>
        <title>Title</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/@vetixy/circular-std@1.0.0/dist/index.min.css"
        />
        <link rel="stylesheet" href="src/styles/reset.css" />
        <link rel="stylesheet" href="src/styles/main.scss" />
    </head>
    <body>
        <div class="container">
            <header class="header">
                <div class="header_logo">
                    <a href="/">
                        <img src="/assets/icons/logo.png" alt="logo"
                    /></a>
                </div>
                <div class="header_links header_links--none"></div>
                <div class="header_burger">
                    <button>
                        <img src="/assets/icons/burger.png" alt="burger" />
                    </button>
                </div>
                <div class="header_buttons">
                    <button
                        class="header_buttons_button header_buttons_signup"
                        type="button"
                    >
                        Login
                    </button>
                    <button
                        class="header_buttons_button header_buttons_login"
                        type="button"
                    >
                        Signup
                    </button>
                </div>
            </header>
        </div>

        <script type="module" src="./src/script/startup.js"></script>
        <script type="module" src="./src/script/index.js"></script>
    </body>
</html>

<!doctype html>
<html lang="en">
    <head>
        <title>Title</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css"
        />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/@vetixy/circular-std@1.0.0/dist/index.min.css"
        />
        <link rel="stylesheet" href="src/styles/main.scss" />
    </head>
    <body>
        <div class="container">
            <header class="header">
                <div class="header__logo">
                    <a href="/">
                        <img src="/assets/icons/logo.svg" alt="logo"
                    /></a>
                </div>
                <nav class="header__links header__links--none"></nav>
                <div class="header__burger">
                    <button type="button">
                        <img src="/assets/icons/burger.svg" alt="hamburger" />
                    </button>
                </div>
                <div class="header__buttons">
                    <button class="button header__button--login" type="button">
                        Log In
                    </button>
                    <button class="button header__button--signup" type="button">
                        Sign Up
                    </button>
                </div>
            </header>

            <div class="hero">
                <div class="hero_left-section">
                    <div class="hero_left-section_top">
                        Explore the world!
                        <img src="assets/icons/work 1.png" alt="work" />
                    </div>
                    <h1 class="hero_left-section_heading"></h1>
                    <p class="hero_left-section_description"></p>
                    <div class="hero_left-section_buttons">
                        <button class="hero_left-section_buttons_get-started">
                            Get Started
                        </button>
                        <button class="hero_left-section_buttons_watch-demo">
                            <img
                                src="assets/icons/play-circle.5 1.png"
                                alt=""
                            />
                            <span>Watch Demo</span>
                        </button>
                    </div>
                </div>
                <div class="hero_right-section">
                    <div class="hero_right-section_box">
                        <div class="hero_right-section_images-left">
                            <img
                                class="hero_right-section_img image-1"
                                src=""
                                alt=""
                            />
                            <img
                                class="hero_right-section_img_msg"
                                src="assets/icons/Frame 16.png"
                                alt="plane"
                            />
                            <img
                                class="hero_right-section_img_friend"
                                src="assets/icons/Frame 17.png"
                                alt="plane"
                            />
                            <img
                                class="hero_right-section_img_location"
                                src="assets/icons/location 1.png"
                                alt="plane"
                            />
                            <img
                                class="hero_right-section_img image-2"
                                src=""
                                alt=""
                            />
                        </div>
                        <img
                            class="hero_right-section_img image-3"
                            src=""
                            alt=""
                        />
                    </div>
                </div>
            </div>
        </div>

        <script type="module" src="./src/script/startup.js"></script>
        <script type="module" src="./src/script/index.js"></script>
    </body>
</html>
